name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.16
          name: "Cura:CareYou ver2.16"
          body: |
            Cura:CareYou ver2.16 リリース

            ### Added
            - タスクを予定（カレンダー）として追加・連携する機能を追加
              - タスク追加・編集ダイアログに「カレンダーの予定に追加」チェックボックスを設置
              - タスク長押しメニューから「カレンダーの予定に追加／削除」操作に対応
              - タスクカードに予定登録状態を示す「予定登録済」バッジを表示
              - カレンダーの予定追加ダイアログで未完了タスクを選択して予定として登録可能
              - タスク完了時および削除時に紐付くカレンダー予定を自動連動更新
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
