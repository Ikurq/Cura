name: Build and Release APK

on:
  # GitHub Actions月間実行枠保護のため、自動pushでの実行は無効化（手動実行のみ許可）
  # push:
  #   branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.17
          name: "Cura:CareYou ver2.17"
          body: |
            ### Added
            - QRコード／バーコードスキャンによるアラーム停止機能（二度寝防止）を追加
              - アラーム作成・編集ダイアログに「QRコードで停止 (二度寝防止)」設定項目を追加
              - アラーム一覧カードに対象設定を示す「QR解除」バッジを表示
              - アラーム鳴動時、登録コードをカメラで読み取るまで停止・読み上げをロックするスキャナー画面を追加
              - 設定の「システム権限と通知」内に解除用QRコードの確認および任意バーコード登録機能を追加
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
