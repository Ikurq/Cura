name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.12
          name: "Cura ver2.12"
          body: |
            Cura ver2.12 リリース
            
            ・タスク期限プッシュ通知リマインダーシステムの実装
              - 目標期限および最終期限に応じた多段階リマインダー通知（目標期限当日朝 8:00、目標期限1時間前、最終期限前日夜 20:00、最終期限1時間前）
              - タスク完了時に未発火のリマインダー予約を自動解除
              - リマインダー通知タップ時にアプリ内のタスク画面へダイレクト遷移
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
