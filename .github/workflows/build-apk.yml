name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.7
          name: "Cura ver2.7"
          body: |
            Cura ver2.7 リリース
            
            ・予定画面（SCHEDULE_MAP）ヘッダーUIの整理・最適化
              - 日付横の下矢印（DatePickerDialog）を撤去し、シンプルで視認性の高い日付表示へ変更
              - 媒体操作用アイコン（⏮/⏭）を洗練されたシェブロン（＜/＞）に変更
              - 曖昧だったアイコンボタン群を撤去し、「今日」ボタンおよび「日 / 月」セグメント切り替えUIを新設
              - 下部ナビゲーションと重複していた出欠アイコンをヘッダーから削除し、画面上部の余白と整理性を向上
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
