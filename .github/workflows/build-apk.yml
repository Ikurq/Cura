name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.4
          name: "Cura ver2.4"
          body: |
            Cura ver2.4 リリース
            
            ・予定連動アラームのセリフ拡張システム（JSONベースの方向性・バリエーション登録機構）を導入
            ・アラーム生成ダイアログに「セリフの方向性（トーン）」選択肢を追加（おまかせ/標準/焦り・緊急/優しめ/厳しめ/元気 など）
            ・テンプレートでの柔軟なプレースホルダー記法（{time}, {event}, {leadTime}, {hour}, {minute}）に対応
            ・起床後モーニングリーディング各文の配列化によるランダム選出に対応
            ・セリフ拡張ガイド（docs/ALARM_TEMPLATES.md）を追加
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
