name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.8
          name: "Cura ver2.8"
          body: |
            Cura ver2.8 リリース
            
            ・タスク追加・編集ダイアログのUI要素を大幅に整理
              - 機能していなかった「予定と連動させる」スピナーおよびラベルを撤去
              - 「目標期限も設定する (詳細設定)」チェックボックスを導入
              - 通常時はシンプルな「期限」のみを表示し、チェック時のみ目標期限設定欄を展開
              - タスク作成・編集時の入力ステップを最小化
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
