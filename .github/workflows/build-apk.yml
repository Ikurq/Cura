name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.5
          name: "Cura ver2.5"
          body: |
            Cura ver2.5 リリース
            
            ・予定連動アラームのセリフ集を大幅拡充（全7カテゴリ、計94パターン）
              - 標準 (4種)
              - 焦り・緊急 (15種)
              - 優しめ (15種)
              - 厳しめ・叱咤 (15種)
              - 元気・活発 (15種)
              - ツンデレ (15種)
              - 論理的・執事 (15種)
            ・アラーム編集画面でトーンごとの登録件数表示に対応
            ・起床後モーニングリーディングのランダム選出に対応
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
