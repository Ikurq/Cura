name: Build and Release APK

on:
  push:
    tags:
      - 'ver*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cura:CareYou ${{ github.ref_name }}"
          body: |
            ### Added
            - 予定連動アラーム作成時の次回外部予定自動選択ボタンを追加
            - 出欠管理の「早退」ステータス集計に対応

            ### Changed
            - ホーム画面およびウィジェットの次回アラーム算出時に繰り返し曜日を考慮するよう変更
            - 音声キャッシュ削除時に登録済みアラームの音声ファイルを保護するよう変更
            - 画面非表示時のバックグラウンドアニメーションおよびタイマーを自動停止するよう最適化

            ### Fixed
            - 新規アラーム作成時に繰り返し曜日選択が反映されない不具合と時刻選択状態の残留バグを修正
            - 予定連動アラーム生成時の話者スタイルID不整合および起床後読み上げのタスク読み上げ設定無視を修正
            - 完了済みタスクが今日のタスク一覧・読み上げに残る不具合とウィジェット更新漏れを修正
            - 権限設定トーストの文字化けとバックアップ復元時の数値型キャスト例外を修正
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
