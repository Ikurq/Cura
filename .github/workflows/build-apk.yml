name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testReleaseUnitTest --info || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/release/

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.3
          name: "Cura ver2.3"
          body: |
            Cura ver2.3 リリース
            
            ・タスク機能の「目標デッドライン（目標期限）」と「本当のデッドライン（最終期限）」の2重期限設定に対応
            ・目標デッドラインに応じた優先度動的計算（目標日が近づく／超過すると優先度上昇）
            ・タスクカードでの両期限表示（目標期限超過・期限切れアラート表示）
            ・タスクカードのタップによる既存タスク編集機能の追加
            ・タイムラインおよびホーム画面／ウィジェットでの目標期限・最終期限の統合表示
            ・目標期限1時間前の事前リマインダー通知を追加
            ・旧バージョンデータとの完全な下位互換性を維持
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
