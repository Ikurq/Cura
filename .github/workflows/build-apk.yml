name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
          keytool -list -v -keystore keystore.jks -storepass android -alias androiddebugkey

      - name: Run App Unit Tests
        run: ./gradlew :app:testReleaseUnitTest --info || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log || (tail -n 120 build.log && exit 1)

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver2.2
          name: "Cura ver2.2"
          body: |
            Cura ver2.2 リリース
            
            ・Googleカレンダー形式の月間カレンダー表示（月間グリッド・予定カラーチップ・当日バッジ）を追加
            ・ヘッダーの切り替えボタンから月表示／日別タイムラインのシームレスな行き来に対応
            ・設定に「操作・表示設定」を追加（デフォルトの初期表示を月表示／日表示から選択可能）
            ・予定作成時の毎週繰り返し設定（年度末3/31まで自動展開）および削除時の範囲選択（この予定のみ／これ以降／すべて）に対応
            ・設定画面から全データ（Lv・経験値、タスク、アラーム等）のJSONバックアップ・復元に対応
            ・UIテキストおよび通知から装飾絵文字を完全撤去
            ・署名キーストアの整合性修正
          files: app/build/outputs/apk/release/app-release.apk
